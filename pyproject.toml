[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetairos"
version = "1.0.0"
description = "AI model for CNS tumour subtype prediction from H&E slides"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "addict==2.4.0",
    "click==8.1.3",
    "h5py==3.8.0",
    "numpy==1.26.1",
    "nystrom-attention==0.0.11",
    "opencv-python==4.8.0.74",
    "openslide-python==1.2.0",
    "pandas==2.0.0",
    "Pillow==9.5.0",
    "pytorch-lightning==2.0.8",
    "PyYAML==6.0",
    "scikit-image==0.21.0",
    "setuptools>=61,<82",
    "timm==1.0.8",
    "torch==1.13.0",
    "torchmetrics==1.1.2",
    "torchvision==0.14.0",
    "tqdm>=4.65",
    "wandb==0.18.7",
]

[project.scripts]
hetairos         = "pipeline:main"
hetairos-train   = "hetairos.aggregator_train_val.model_run:main"
hetairos-test    = "hetairos.aggregator_train_val.model_run:main"
hetairos-tile    = "hetairos.preprocessing.tiling.main_create_tiles:main"
hetairos-extract = "hetairos.preprocessing.feature_extraction.get_features:main"

[project.optional-dependencies]
plots = [
    "lifelines",
    "matplotlib",
    "openpyxl",
    "ptitprince",
    "scikit-learn",
    "seaborn",
]
reports = [
    "langextract",
    "lmstudio",
    "openpyxl",
    "pdfplumber",
    "python-docx",
    "requests",
]

[tool.setuptools]
py-modules = ["pipeline"]
include-package-data = true

[tool.setuptools.package-data]
"hetairos" = ["*.yaml"]
"hetairos.aggregator_train_val" = ["*.yaml", "annot_files/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hetairos*"]
